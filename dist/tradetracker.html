<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}</style>
<title>TradeTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ============================================================
   TOKENS — light is the base set; both dark scopes restate them.
   ============================================================ */
:root{
  color-scheme: light;
  --ground:#f2f4f8;
  --surface:#ffffff;
  --surface-2:#eceff5;
  --surface-3:#e2e7ef;
  --line:#dde2ea;
  --line-strong:#c4ccd9;
  --ink:#10151c;
  --ink-2:#4c5665;
  --ink-3:#79838f;
  --gold:#8f6613;
  --gold-ink:#7a570f;
  --gold-wash:rgba(143,102,19,.10);
  --profit:#0d7a55;
  --loss:#c0392f;
  --caution:#a85f10;
  --neutral:#6b7482;
  --s1:#2a78d6;
  --s2:#eb6834;
  --s3:#1baf7a;
  --s4:#4a3aa7;
  --grid:#e6eaf1;
  --axis:#c4ccd9;
  --profit-wash:rgba(13,122,85,.12);
  --loss-wash:rgba(192,57,47,.12);
  --caution-wash:rgba(168,95,16,.12);
  --ring:rgba(143,102,19,.45);
  --shadow-sm:0 1px 2px rgba(16,21,28,.05);
  --shadow-md:0 1px 3px rgba(16,21,28,.06), 0 10px 28px rgba(16,21,28,.07);
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --font-ui:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display:"Archivo", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0a0d13;
    --surface:#121722;
    --surface-2:#171d2a;
    --surface-3:#1e2534;
    --line:#232b3a;
    --line-strong:#333d50;
    --ink:#e9eef7;
    --ink-2:#9ba7b9;
    --ink-3:#6d7889;
    --gold:#d9a94a;
    --gold-ink:#e5bc6b;
    --gold-wash:rgba(217,169,74,.13);
    --profit:#35b184;
    --loss:#e2685f;
    --caution:#e08c3c;
    --neutral:#8b95a4;
    --s1:#3987e5;
    --s2:#d95926;
    --s3:#199e70;
    --s4:#9085e9;
    --grid:#1d2431;
    --axis:#333d50;
    --profit-wash:rgba(53,177,132,.15);
    --loss-wash:rgba(226,104,95,.15);
    --caution-wash:rgba(224,140,60,.15);
    --ring:rgba(217,169,74,.5);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow-md:0 1px 3px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0a0d13;
  --surface:#121722;
  --surface-2:#171d2a;
  --surface-3:#1e2534;
  --line:#232b3a;
  --line-strong:#333d50;
  --ink:#e9eef7;
  --ink-2:#9ba7b9;
  --ink-3:#6d7889;
  --gold:#d9a94a;
  --gold-ink:#e5bc6b;
  --gold-wash:rgba(217,169,74,.13);
  --profit:#35b184;
  --loss:#e2685f;
  --caution:#e08c3c;
  --neutral:#8b95a4;
  --s1:#3987e5;
  --s2:#d95926;
  --s3:#199e70;
  --s4:#9085e9;
  --grid:#1d2431;
  --axis:#333d50;
  --profit-wash:rgba(53,177,132,.15);
  --loss-wash:rgba(226,104,95,.15);
  --caution-wash:rgba(224,140,60,.15);
  --ring:rgba(217,169,74,.5);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 1px 3px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:var(--font-ui);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--profit)}
.neg{color:var(--loss)}
.warn{color:var(--caution)}
.mut{color:var(--ink-3)}

/* ============================================================
   SHELL
   ============================================================ */
.shell{max-width:1420px;margin:0 auto;padding:0 24px 72px}
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--ground) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding:0 24px;
}
.topbar-in{max-width:1420px;margin:0 auto;display:flex;align-items:center;gap:18px;height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.02em}
.brand .mark{
  width:22px;height:22px;border-radius:5px;display:grid;place-items:center;
  background:var(--gold-wash);border:1px solid color-mix(in srgb,var(--gold) 40%, transparent);
  align-self:center;
}
.brand .mark svg{display:block}
.brand em{font-style:normal;color:var(--gold-ink)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.langswitch{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r-sm);overflow:hidden}
.langbtn{appearance:none;background:transparent;border:0;padding:5px 10px;font-size:12px;font-weight:600;
  letter-spacing:.04em;color:var(--ink-3);cursor:pointer;transition:background .12s,color .12s}
.langbtn:hover{color:var(--ink)}
.langbtn[aria-pressed="true"]{background:var(--gold-wash);color:var(--gold-ink)}

.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 22px;scrollbar-width:thin}
.tab{
  appearance:none;background:none;border:0;border-bottom:2px solid transparent;
  padding:13px 14px;color:var(--ink-2);font-weight:500;cursor:pointer;white-space:nowrap;
  transition:color .12s, border-color .12s;
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.btn{
  appearance:none;border:1px solid var(--line-strong);background:var(--surface);
  color:var(--ink);padding:7px 13px;border-radius:var(--r-sm);cursor:pointer;font-weight:500;font-size:13px;
  display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn-primary{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn-primary{color:#141007}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-primary{color:#141007}}
.btn-primary:hover{background:var(--gold-ink);border-color:var(--gold-ink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-danger{color:var(--loss);border-color:transparent;background:transparent}
.btn-danger:hover{background:var(--loss-wash);border-color:transparent}
.btn-sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-sm)}
.panel-pad{padding:20px 22px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.panel-title{font-size:15px;font-weight:600}
.panel-sub{color:var(--ink-3);font-size:12.5px}

.eyebrow{
  font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
}
.section{margin:28px 0 0}
.section > h2{font-size:17px;font-weight:600;margin-bottom:2px}
.section > p.lede{color:var(--ink-3);font-size:13px;margin:0 0 14px}

.grid{display:grid;gap:14px;align-items:start}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.split-even{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1080px){.split,.split-even,.g4,.g5,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.grid,.split,.split-even{grid-template-columns:minmax(0,1fr)}}

/* Stat tiles — the figures are the point, so they lead */
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px 15px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .k{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.tile .v{font-family:var(--font-mono);font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.2}
.tile .s{font-size:12px;color:var(--ink-3)}
.tile.lift{border-color:color-mix(in srgb,var(--gold) 35%, var(--line));box-shadow:var(--shadow-md)}

.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink-2);font-size:13px}
.kv .v{font-family:var(--font-mono);font-size:13px;font-weight:500}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pill-win{background:var(--profit-wash);color:var(--profit)}
.pill-loss{background:var(--loss-wash);color:var(--loss)}
.pill-be{background:var(--surface-3);color:var(--ink-2)}
.pill-long{background:color-mix(in srgb,var(--s1) 15%, transparent);color:var(--s1)}
.pill-short{background:color-mix(in srgb,var(--s2) 15%, transparent);color:var(--s2)}
.pill-tag{background:var(--surface-3);color:var(--ink-2);font-weight:500}
.pill-warn{background:var(--caution-wash);color:var(--caution)}
.pill-sym{background:var(--gold-wash);color:var(--gold-ink);font-family:var(--font-mono);font-weight:600}

.chip{
  appearance:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;
  padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2);
}
.chip[aria-pressed="true"]{background:var(--gold-wash);border-color:color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold-ink);font-weight:600}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:11.5px;color:var(--ink-3)}
.req{color:var(--loss)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:8px 10px;width:100%;color:var(--ink);
}
input[type=number],input[type=date],input[type=time]{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
textarea{min-height:76px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ring);outline-offset:0;border-color:transparent}
.radios{display:flex;gap:14px;flex-wrap:wrap}
.radios label,.checks label{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px 18px}
input[type=radio],input[type=checkbox]{accent-color:var(--gold);width:15px;height:15px}

/* Tables */
.tw{overflow-x:auto;border-radius:var(--r-md)}
table{border-collapse:collapse;width:100%;min-width:820px}
th{
  text-align:left;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--line-strong);white-space:nowrap;
}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--surface-2)}
td.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
th.r,td.r{text-align:right}

/* Charts */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:var(--font-ui);fill:var(--ink-3)}
.chart .tick{font-size:10.5px;font-family:var(--font-mono);fill:var(--ink-3)}
.chart .glab{font-size:11px;fill:var(--ink-2)}
.chart .gridline{stroke:var(--grid);stroke-width:1}
.chart .axisline{stroke:var(--axis);stroke-width:1}
.chart-wrap{position:relative}
.chart-host{width:100%;min-height:1px}
.tip{
  position:absolute;pointer-events:none;z-index:20;opacity:0;transform:translate(-50%,-115%);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);
  padding:7px 10px;box-shadow:var(--shadow-md);font-size:12px;white-space:nowrap;transition:opacity .1s;
}
.tip .t{font-weight:600;margin-bottom:2px}
.tip .l{color:var(--ink-3)}
.tip.on{opacity:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:10px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:6px;vertical-align:-1px}

/* Calendar */
.cal{width:100%;border-collapse:separate;border-spacing:3px;min-width:660px}
.cal th{padding:4px;text-align:center;border:0}
.cal td{padding:0;border:0}
.cal .cell{border-radius:7px;padding:6px 7px;min-height:62px;display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);background:var(--surface-2)}
.cal .cell.out{opacity:.35}
.cal .cell .d{font-size:11px;color:var(--ink-3);font-family:var(--font-mono)}
.cal .cell .p{font-family:var(--font-mono);font-size:12.5px;font-weight:600}
.cal .cell .c{font-size:10.5px;color:var(--ink-3)}
.cal .tot{background:transparent;border:0;padding:6px 4px;text-align:right;font-family:var(--font-mono);font-size:12.5px;font-weight:600}

/* Insight rows — a stripe encodes severity, so state reads before the text */
.insight{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-2);border-left:3px solid var(--neutral)}
.insight.good{border-left-color:var(--profit)}
.insight.bad{border-left-color:var(--loss)}
.insight.warn{border-left-color:var(--caution)}
.insight.info{border-left-color:var(--s1)}
.insight .body{flex:1;min-width:0}
.insight .h{font-weight:600;font-size:13.5px;margin-bottom:2px}
.insight .d{font-size:12.5px;color:var(--ink-2)}
.insight .badge{font-family:var(--font-mono);font-size:12px;font-weight:600;padding:3px 8px;border-radius:5px;background:var(--surface-3);white-space:nowrap}

/* Bar list — horizontal comparison rows */
.blist{display:flex;flex-direction:column;gap:9px}
.brow{display:grid;grid-template-columns:minmax(96px,auto) 1fr minmax(70px,auto);gap:11px;align-items:center;font-size:13px}
.brow .lab{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .track{height:9px;border-radius:3px;background:var(--surface-3);position:relative;overflow:hidden}
.brow .fill{position:absolute;top:0;bottom:0;border-radius:3px}
.brow .val{font-family:var(--font-mono);font-size:12.5px;text-align:right;font-weight:500}

.banner{display:flex;gap:12px;align-items:center;padding:11px 15px;border-radius:var(--r-md);font-size:13px;border:1px solid}
.banner-demo{background:var(--gold-wash);border-color:color-mix(in srgb,var(--gold) 35%,transparent);color:var(--gold-ink)}
.banner-info{background:var(--surface-2);border-color:var(--line);color:var(--ink-2)}
.banner .grow{flex:1;min-width:0}

.shot-frame{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--surface-2);min-height:120px;display:grid;place-items:center}
.shot-img{width:100%;display:block}
.shot-missing{color:var(--ink-3);font-size:12.5px;padding:28px 12px;text-align:center}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;font-size:13.5px;color:var(--ink-2)}
.steps li{padding-left:3px}
.steps strong{color:var(--ink)}
code{font-family:var(--font-mono);font-size:.92em;background:var(--surface-3);padding:1px 5px;border-radius:4px}
.modal-body-rich{font-size:13.5px}
.empty{padding:44px 20px;text-align:center;color:var(--ink-3)}
.empty h3{font-size:15px;color:var(--ink-2);margin-bottom:5px}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);z-index:90;
  background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:500;
  opacity:0;transition:opacity .16s,transform .16s;pointer-events:none;box-shadow:var(--shadow-md);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.modal-bg{position:fixed;inset:0;background:rgba(6,9,14,.6);z-index:60;display:grid;place-items:center;padding:24px}
.modal{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-lg);max-width:520px;width:100%;padding:22px 24px;box-shadow:var(--shadow-md)}
.modal h3{font-size:16px;margin-bottom:8px}
.modal p{color:var(--ink-2);font-size:13.5px;margin:0 0 18px;line-height:1.55}
.modal p strong{color:var(--ink)}
.modal-actions{flex-wrap:wrap}
.modal-actions{display:flex;gap:9px;justify-content:flex-end}
[hidden]{display:none !important}

.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:820px){.formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.formgrid{grid-template-columns:minmax(0,1fr)}}
.span2{grid-column:span 2}
.span3{grid-column:1/-1}
@media (max-width:520px){.span2,.span3{grid-column:auto}}
.fieldset{border:0;padding:0;margin:0 0 22px}
.fieldset > legend{font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0;margin-bottom:12px}
.divider{height:1px;background:var(--line);margin:22px 0}
.rowflex{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{width:auto;min-width:130px;padding:6px 9px;font-size:13px}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M1 10.5 L4 6.2 L6.6 8 L12 1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--gold)"/><path d="M1 12h11" stroke="var(--gold)" stroke-width="1.1" stroke-linecap="round" opacity=".45"/></svg>
      </span>
      Trade<em>Tracker</em>
    </div>
    <div class="rowflex" style="gap:6px">
      <label for="accSel" class="eyebrow" style="margin-right:2px" data-t="Account">Account</label>
      <select id="accSel" style="width:auto;min-width:120px;padding:5px 9px;font-size:13px"></select>
    </div>
    <div class="topbar-right">
      <div class="langswitch" role="group" aria-label="Language">
        <button class="langbtn" data-lang="en" aria-pressed="true">EN</button>
        <button class="langbtn" data-lang="tr" aria-pressed="false">TR</button>
      </div>
      <span id="syncBadge" class="eyebrow" data-t-title="Where your trades are stored" title="Where your trades are stored">Local</span>
      <button class="btn btn-sm" id="btnExport" data-t="Export">Export</button>
      <button class="btn btn-sm" id="btnImport" data-t="Import">Import</button>
      <button class="btn btn-primary btn-sm" id="btnQuickAdd" data-t="+ New trade">+ New trade</button>
    </div>

/** Translate. The key is the English string, so an untranslated key
 *  renders as English instead of breaking. {named} placeholders are
 *  substituted after lookup, which lets Turkish reorder them. */
function tx(k, p) {
  let s = (LANG === 'tr' && TR[k] !== undefined) ? TR[k] : k;
  if (p) for (const x in p) s = s.split('{' + x + '}').join(p[x]);
  return s;
}

const MON_EN = ['January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December'];
const MON_TR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran',
  'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const MON_TR_SHORT = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
const DAY_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAY_TR = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];

function monLong(i) { return LANG === 'tr' ? MON_TR[i] : MON_EN[i]; }
function monShort(i) { return LANG === 'tr' ? MON_TR_SHORT[i] : MON_EN[i].slice(0, 3); }
function dayShort(i) { return LANG === 'tr' ? DAY_TR[i] : DAY_EN[i]; }
/** Calendar column heads. One letter is enough in English; Turkish
 *  needs two, because four weekdays start with P or C. */
function dayInitial(i) { return LANG === 'tr' ? DAY_TR[i].slice(0, 2) : DAY_EN[i][0]; }

/** Static markup carries data-t="key"; this walks it after a change. */
function applyStaticLang() {
  $$('[data-t]').forEach(el => { el.textContent = tx(el.dataset.t); });
  $$('[data-t-title]').forEach(el => { el.title = tx(el.dataset.tTitle); });
  $$('[data-t-ph]').forEach(el => { el.placeholder = tx(el.dataset.tPh); });
  document.documentElement.lang = LANG;
}

<script>
/* ============================================================
   TradeTracker — a trading journal that scores the process,
   not just the P&L.
   ============================================================ */
"use strict";

/* ---------- small utilities ---------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const sum = a => a.reduce((x, y) => x + y, 0);
const mean = a => (a.length ? sum(a) / a.length : 0);
const uid = () => 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function money(v, dp) {
  const n = Number(v) || 0;
  const d = dp == null ? (Math.abs(n) >= 1000 ? 0 : 2) : dp;
  return (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
}
function signed(v, dp) { const n = Number(v) || 0; return (n > 0 ? '+' : '') + money(n, dp); }
function rfmt(v) { const n = Number(v) || 0; return (n > 0 ? '+' : '') + n.toFixed(2) + 'R'; }
function pct(v, dp) { return (Number(v) || 0).toFixed(dp == null ? 1 : dp) + '%'; }
function cls(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : 'mut'; }
function num(v, dp) { return (Number(v) || 0).toFixed(dp == null ? 2 : dp); }

/* ============================================================
   STORAGE

   localStorage is the single source of truth for trades and
   settings. Screenshots go to IndexedDB instead: two JPEGs a
   trade would exhaust the ~5 MB localStorage quota inside about
   twenty trades, and losing the whole journal to a full quota is
   not a trade worth making.

   A backup file carries both, so importing one on another machine
   restores the journal exactly — screenshots included.
   ============================================================ */
const LS_T = 'tradetracker.trades.v1';
const LS_S = 'tradetracker.settings.v1';
const LS_M = 'tradetracker.meta.v1';
const IDB_NAME = 'tradetracker', IDB_STORE = 'shots';

/** 32-bit FNV-1a. Not security — it catches a truncated or edited backup. */
function hash32(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8, '0');
}
/** The exact shape a checksum is taken over, so export and import agree. */
function backupBody(settings, trades, screenshots) {
  return { settings: settings, trades: trades, screenshots: screenshots };
}

/** Screenshots, keyed `<tradeId>:pre` and `<tradeId>:post`. */
const Shots = {
  _db: null, _dead: false, cache: new Map(),

  async open() {
    if (this._db || this._dead) return this._db;
    try {
      this._db = await new Promise((res, rej) => {
        const rq = indexedDB.open(IDB_NAME, 1);
        rq.onupgradeneeded = () => {
          if (!rq.result.objectStoreNames.contains(IDB_STORE)) rq.result.createObjectStore(IDB_STORE);
        };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
        rq.onblocked = () => rej(new Error('blocked'));
      });
    } catch (e) { this._dead = true; this._db = null; }
    return this._db;
  },
  async _run(mode, fn) {
    const db = await this.open();
    if (!db) throw new Error('no indexeddb');
    return new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, mode);
      const rq = fn(tx.objectStore(IDB_STORE));
      tx.oncomplete = () => res(rq ? rq.result : null);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    });
  },
  async get(key) {
    if (this.cache.has(key)) return this.cache.get(key);
    try {
      const v = await this._run('readonly', s => s.get(key));
      if (v) this.cache.set(key, v);
      return v || '';
    } catch (e) { return ''; }
  },
  async put(key, val) {
    this.cache.set(key, val);
    try { await this._run('readwrite', s => s.put(val, key)); return true; }
    catch (e) { return false; }
  },
  async del(key) {
    this.cache.delete(key);
    try { await this._run('readwrite', s => s.delete(key)); } catch (e) {}
  },
  /** Every screenshot in one object — what a backup carries. */
  async dump() {
    const db = await this.open();
    if (!db) return {};
    return new Promise(res => {
      const out = {};
      let tx;
      try { tx = db.transaction(IDB_STORE, 'readonly'); } catch (e) { return res(out); }
      const rq = tx.objectStore(IDB_STORE).openCursor();
      rq.onsuccess = () => { const c = rq.result; if (c) { out[c.key] = c.value; c.continue(); } };
      tx.oncomplete = () => res(out);
      tx.onerror = () => res(out);
    });
  },
  async clear() {
    this.cache.clear();
    try { await this._run('readwrite', s => s.clear()); } catch (e) {}
  },
  async restore(map, wipeFirst) {
    if (wipeFirst) await this.clear();
    const entries = Object.entries(map || {});
    for (const [k, v] of entries) if (typeof v === 'string' && v.slice(0, 5) === 'data:') await this.put(k, v);
    return entries.length;
  }
};

/** Backups written before screenshots moved to IndexedDB kept the image
 *  inline on the trade. Lift those out so an old file still imports whole. */
function liftLegacyShots(raw) {
  const out = {};
  (raw || []).forEach(t => {
    const s = t && t.shots;
    if (!s) return;
    ['pre', 'post'].forEach(k => {
      if (typeof s[k] === 'string' && s[k].slice(0, 5) === 'data:') out[t.id + ':' + k] = s[k];
    });
  });
  return out;
}

const Store = {
  trades: [], settings: defaultSettings(), demo: false,
  lsOk: true, meta: { lastExport: 0, changes: 0 },

  /** Opened straight off disk, some browsers refuse local storage outright.
   *  Find out at boot so the page can say so instead of losing work. */
  probe() {
    try {
      localStorage.setItem('tradetracker.probe', '1');
      localStorage.removeItem('tradetracker.probe');
      this.lsOk = true;
    } catch (e) { this.lsOk = false; }
    return this.lsOk;
  },

  load() {
    try {
      const t = JSON.parse(localStorage.getItem(LS_T) || 'null');
      const s = JSON.parse(localStorage.getItem(LS_S) || 'null');
      const m = JSON.parse(localStorage.getItem(LS_M) || 'null');
      if (Array.isArray(t)) {
        const legacy = liftLegacyShots(t);
        this.trades = t.map(normalizeTrade);
        if (Object.keys(legacy).length) Shots.restore(legacy, false).then(() => this.persist());
      }
      if (s) this.settings = Object.assign(defaultSettings(), s);
      if (m) this.meta = Object.assign({ lastExport: 0, changes: 0 }, m);
    } catch (e) { /* cleared or unreadable — start fresh */ }
  },

  /** Returns false when the browser refused the write, so callers can say so.
   *  Settings persist even in demo mode — the language switch is a setting, and
   *  it has to survive a reload before the first real trade is logged. Only the
   *  sample trades are held back. */
  persist() {
    try {
      if (!this.demo) localStorage.setItem(LS_T, JSON.stringify(this.trades));
      localStorage.setItem(LS_S, JSON.stringify(this.settings));
      localStorage.setItem(LS_M, JSON.stringify(this.meta));
      return true;
    } catch (e) {
      this.lsOk = false;
      badge(tx('Not saved'), tx('The last change could not be written to this browser'));
      toast(String(e && e.name) === 'QuotaExceededError'
        ? tx('Browser storage is full — export a backup, then delete some old trades.')
        : tx('This browser refused to save. Export a backup before you close the page.'));
      return false;
    }
  },

  async saveTrade(t) {
    const rec = normalizeTrade(t);
    rec.updatedAt = Date.now();
    if (this.demo) { this.trades = []; this.demo = false; $('#demoBanner').hidden = true; }
    const i = this.trades.findIndex(x => x.id === rec.id);
    if (i >= 0) this.trades[i] = rec; else this.trades.push(rec);
    this.meta.changes++;
    this.persist();
    return rec;
  },

  async deleteTrade(id) {
    this.trades = this.trades.filter(t => t.id !== id);
    this.meta.changes++;
    this.persist();
    await Shots.del(id + ':pre');
    await Shots.del(id + ':post');
  },

  saveSettings() { this.meta.changes++; this.persist(); },

  async clearAll() {
    this.trades = []; this.demo = false; this.meta.changes++;
    this.persist();
    await Shots.clear();
  },

  clearDemo() { this.demo = false; this.trades = []; $('#demoBanner').hidden = true; this.persist(); render(); },

  unsaved() { return Math.max(0, this.meta.changes); },

  account() { return this.settings.accounts.find(a => a.id === this.settings.active) || this.settings.accounts[0]; },
  scoped() {
    const a = this.account();
    if (!a) return [];
    return this.trades.filter(t => t.account === a.id).sort(byExit);
  }
};

<script>
/* ============================================================
   METRICS — every number the page shows is computed here, once,
   from the trade list. Views only format.
   ============================================================ */

function metrics(trades, account) {
  const n = trades.length;
  const wins = trades.filter(t => t.pnl > 0);
  const losses = trades.filter(t => t.pnl < 0);
  const gp = sum(wins.map(t => t.pnl));
  const gl = Math.abs(sum(losses.map(t => t.pnl)));
  const pnl = sum(trades.map(t => t.pnl));
  const rs = trades.map(R);
  const start = account ? Number(account.start) || 0 : 0;

  // Equity curve, in trade order
  let eq = start, peak = start, maxDD = 0, maxDDpct = 0;
  const curve = [{ i: 0, at: trades.length ? (trades[0].exitAt || trades[0].entryAt) : null, eq: start, dd: 0, t: null }];
  trades.forEach((t, i) => {
    eq += t.pnl;
    peak = Math.max(peak, eq);
    const dd = peak - eq;
    if (dd > maxDD) { maxDD = dd; maxDDpct = peak > 0 ? dd / peak * 100 : 0; }
    curve.push({ i: i + 1, at: t.exitAt || t.entryAt, eq: eq, dd: dd, t: t });
  });

  // Streaks
  let cw = 0, cl = 0, mw = 0, ml = 0;
  trades.forEach(t => {
    if (t.pnl > 0) { cw++; cl = 0; mw = Math.max(mw, cw); }
    else if (t.pnl < 0) { cl++; cw = 0; ml = Math.max(ml, cl); }
    else { cw = 0; cl = 0; }
  });
  let curStreak = 0, curKind = '';
  for (let i = trades.length - 1; i >= 0; i--) {
    const s = trades[i].pnl > 0 ? 'win' : trades[i].pnl < 0 ? 'loss' : 'be';
    if (s === 'be') break;
    if (!curKind) curKind = s;
    if (s !== curKind) break;
    curStreak++;
  }

  const avgWin = mean(wins.map(t => t.pnl));
  const avgLoss = mean(losses.map(t => t.pnl));
  const stdR = rs.length > 1 ? Math.sqrt(sum(rs.map(r => (r - mean(rs)) ** 2)) / (rs.length - 1)) : 0;

  return {
    n, wins: wins.length, losses: losses.length,
    winRate: n ? wins.length / n * 100 : 0,
    pnl, gp, gl,
    pf: gl > 0 ? gp / gl : (gp > 0 ? Infinity : 0),
    expectancyR: mean(rs),
    expectancyUSD: mean(trades.map(t => t.pnl)),
    avgWin, avgLoss,
    avgWinR: mean(wins.map(R)), avgLossR: mean(losses.map(R)),
    wlRatio: avgLoss ? Math.abs(avgWin / avgLoss) : 0,
    largestWin: wins.length ? Math.max(...wins.map(t => t.pnl)) : 0,
    largestLoss: losses.length ? Math.min(...losses.map(t => t.pnl)) : 0,
    avgRR: mean(trades.filter(t => t.risk > 0 && t.target && t.entry).map(t => Math.abs(t.target - t.entry) / Math.abs(t.entry - t.stop || 1))),
    rs, stdR,
    // System quality: expectancy per unit of noise. Above ~0.5 is a system worth sizing up.
    sqn: stdR > 0 && n > 1 ? (mean(rs) / stdR) * Math.sqrt(n) : 0,
    stability: stdR > 0 ? mean(rs) / stdR : 0,
    curve, start, equity: eq, maxDD, maxDDpct,
    maxWinStreak: mw, maxLossStreak: ml, curStreak, curKind,
    returnPct: start > 0 ? pnl / start * 100 : 0
  };
}

/** Group trades by a key and rank the groups by total P&L. */
function group(trades, keyFn, labelFn) {
  const m = new Map();
  trades.forEach(t => {
    const k = keyFn(t);
    if (k === null || k === undefined || k === '') return;
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(t);
  });
  return Array.from(m.entries()).map(([k, list]) => {
    const w = list.filter(t => t.pnl > 0).length;
    return {
      key: k, label: labelFn ? labelFn(k) : String(k), trades: list, n: list.length,
      pnl: sum(list.map(t => t.pnl)), wins: w,
      winRate: list.length ? w / list.length * 100 : 0,
      avgR: mean(list.map(R)),
      totalR: sum(list.map(R))
    };
  }).sort((a, b) => b.pnl - a.pnl);
}

function byDayMap(trades) {
  const m = new Map();
  trades.forEach(t => {
    const d = dt(t.exitAt || t.entryAt); if (!d) return;
    const k = dkey(d);
    if (!m.has(k)) m.set(k, { pnl: 0, n: 0, r: 0 });
    const c = m.get(k); c.pnl += t.pnl; c.n++; c.r += R(t);
  });
  return m;
}

function bucketByPeriod(trades, kind) {
  const m = new Map();
  trades.forEach(t => {
    const d = dt(t.exitAt || t.entryAt); if (!d) return;
    let k, lab;
    if (kind === 'week') {
      const s = new Date(d); s.setDate(s.getDate() - s.getDay()); s.setHours(0, 0, 0, 0);
      k = dkey(s); lab = monShort(s.getMonth()) + ' ' + s.getDate();
    } else {
      k = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      lab = monShort(d.getMonth()) + ' ' + d.getFullYear();
    }
    if (!m.has(k)) m.set(k, { key: k, label: lab, pnl: 0, n: 0 });
    const c = m.get(k); c.pnl += t.pnl; c.n++;
  });
  return Array.from(m.values()).sort((a, b) => a.key < b.key ? -1 : 1);
}

/* ---------- R-multiple distribution ---------- */
function rHistogram(trades) {
  const bins = [
    { lo: -Infinity, hi: -2, label: '< -2R' },
    { lo: -2, hi: -1, label: '-2 to -1R' },
    { lo: -1, hi: 0, label: '-1 to 0R' },
    { lo: 0, hi: 1, label: '0 to 1R' },
    { lo: 1, hi: 2, label: '1 to 2R' },
    { lo: 2, hi: 3, label: '2 to 3R' },
    { lo: 3, hi: Infinity, label: '3R +' }
  ].map(b => Object.assign({ n: 0 }, b));
  trades.forEach(t => {
    const r = R(t);
    const b = bins.find(b => r >= b.lo && r < b.hi) || bins[bins.length - 1];
    b.n++;
  });
  return bins;
}

/* ---------- MAE / MFE — heat taken vs. profit left behind ---------- */
function excursion(trades) {
  const withData = trades.filter(t => t.maeR !== null || t.mfeR !== null);
  const wins = withData.filter(t => t.pnl > 0);
  const losses = withData.filter(t => t.pnl < 0);
  const wMae = wins.filter(t => t.maeR !== null).map(t => Math.abs(t.maeR));
  const lMfe = losses.filter(t => t.mfeR !== null).map(t => Math.abs(t.mfeR));
  const capture = wins.filter(t => t.mfeR).map(t => clamp(R(t) / Math.abs(t.mfeR), 0, 1.2));
  const giveback = withData.filter(t => t.pnl <= 0 && t.mfeR !== null && Math.abs(t.mfeR) >= 1);
  return {
    covered: withData.length, total: trades.length,
    avgWinHeat: mean(wMae),
    maxWinHeat: wMae.length ? Math.max(...wMae) : 0,
    avgLossPotential: mean(lMfe),
    captureRate: mean(capture) * 100,
    giveback: giveback.length,
    givebackR: sum(giveback.map(t => Math.abs(t.mfeR) - R(t))),
    points: withData.filter(t => t.mfeR !== null).map(t => ({ x: Math.abs(t.mfeR), y: R(t), t }))
  };
}

/* ---------- Discipline — the flags that cost money ---------- */
function disciplineFlags(trades, cfg) {
  const s = cfg || Store.settings;
  const sorted = trades.slice().sort((a, b) => new Date(a.entryAt) - new Date(b.entryAt));
  const dayCount = new Map(), dayR = new Map();
  const out = new Map();

  sorted.forEach((t, i) => {
    const flags = [];
    const en = dt(t.entryAt), ex = dt(t.exitAt);
    const k = en ? dkey(en) : '—';

    if (!t.planned) flags.push({ id: 'unplanned', label: 'Not in the plan' });
    if (t.adherence && !t.adherence.rules) flags.push({ id: 'rules', label: 'Rule broken' });
    if (t.adherence && !t.adherence.sizing) flags.push({ id: 'sizing', label: 'Size off' });

    // Revenge: opened inside the cooldown window after a loss closed
    for (let j = i - 1; j >= 0; j--) {
      const p = sorted[j], pex = dt(p.exitAt || p.entryAt);
      if (!pex || !en) break;
      const mins = (en - pex) / 60000;
      if (mins < 0) continue;
      if (mins > s.revengeMinutes) break;
      if (p.pnl < 0) { flags.push({ id: 'revenge', label: 'Straight after a loss' }); break; }
    }

    // Overtrading and trading past the daily loss limit
    const c = (dayCount.get(k) || 0);
    if (c >= s.maxTradesPerDay) flags.push({ id: 'overtrade', label: 'Past the daily trade cap' });
    const rSoFar = dayR.get(k) || 0;
    if (rSoFar <= -Math.abs(s.dailyLossLimitR)) flags.push({ id: 'pastlimit', label: 'Past the daily loss limit' });

    dayCount.set(k, c + 1);
    dayR.set(k, rSoFar + R(t));
    out.set(t.id, flags);
  });
  return out;
}

function disciplineReport(trades, cfg) {
  const flagMap = disciplineFlags(trades, cfg);
  const clean = trades.filter(t => (flagMap.get(t.id) || []).length === 0);
  const dirty = trades.filter(t => (flagMap.get(t.id) || []).length > 0);
  const counts = new Map();
  flagMap.forEach(fl => fl.forEach(f => {
    if (!counts.has(f.id)) counts.set(f.id, { id: f.id, label: f.label, n: 0, pnl: 0 });
    counts.get(f.id).n++;
  }));
  trades.forEach(t => (flagMap.get(t.id) || []).forEach(f => { counts.get(f.id).pnl += t.pnl; }));

  const adhKeys = ADHERENCE_KEYS.map(([k, lab]) => {
    const kept = trades.filter(t => t.adherence && !!t.adherence[k]);
    return { key: k, label: lab, kept: kept.length, n: trades.length, rate: trades.length ? kept.length / trades.length * 100 : 0 };
  });

  return {
    flagMap, clean, dirty,
    counts: Array.from(counts.values()).sort((a, b) => a.pnl - b.pnl),
    cleanPnl: sum(clean.map(t => t.pnl)),
    dirtyPnl: sum(dirty.map(t => t.pnl)),
    cleanR: sum(clean.map(R)),
    dirtyR: sum(dirty.map(R)),
    score: trades.length ? clean.length / trades.length * 100 : 100,
    cleanWinRate: clean.length ? clean.filter(t => t.pnl > 0).length / clean.length * 100 : 0,
    dirtyWinRate: dirty.length ? dirty.filter(t => t.pnl > 0).length / dirty.length * 100 : 0,
    adherence: adhKeys,
    byQuality: group(trades.filter(t => t.quality), t => t.quality, k => tx('Grade {n}', { n: k })).sort((a, b) => a.key - b.key),
    byEmotion: group(trades.filter(t => t.emotion), t => t.emotion, k => tx(k))
  };
}

/* ---------- Monte Carlo — the same edge, reshuffled ---------- */
function monteCarlo(rs, opt) {
  const o = Object.assign({ paths: 1500, horizon: 100, riskPct: 1, start: 10000, ruinPct: 30 }, opt);
  if (!rs.length) return null;
  const steps = o.horizon;
  const bands = [];
  const finals = [], maxDDs = [];
  let ruin = 0, below = 0;
  // Column-major store so percentile bands are cheap
  const grid = Array.from({ length: steps + 1 }, () => new Float64Array(o.paths));
  for (let p = 0; p < o.paths; p++) {
    let eq = o.start, peak = o.start, mdd = 0, ruined = false;
    grid[0][p] = eq;
    for (let s = 1; s <= steps; s++) {
      const r = rs[(Math.random() * rs.length) | 0];
      eq += eq * (o.riskPct / 100) * r;
      if (eq < 0) eq = 0;
      peak = Math.max(peak, eq);
      const dd = peak > 0 ? (peak - eq) / peak * 100 : 0;
      if (dd > mdd) mdd = dd;
      if (dd >= o.ruinPct) ruined = true;
      grid[s][p] = eq;
    }
    finals.push(eq); maxDDs.push(mdd);
    if (ruined) ruin++;
    if (eq < o.start) below++;
  }
  const pct_ = (arr, q) => { const a = Float64Array.from(arr).sort(); return a[clamp(Math.floor(q * (a.length - 1)), 0, a.length - 1)]; };
  for (let s = 0; s <= steps; s++) {
    const col = grid[s];
    const a = Float64Array.from(col).sort();
    const at = q => a[clamp(Math.floor(q * (a.length - 1)), 0, a.length - 1)];
    bands.push({ s, p05: at(0.05), p25: at(0.25), p50: at(0.5), p75: at(0.75), p95: at(0.95) });
  }
  return {
    bands, finals, opt: o,
    median: pct_(finals, 0.5), p05: pct_(finals, 0.05), p95: pct_(finals, 0.95),
    ruinProb: ruin / o.paths * 100,
    belowProb: below / o.paths * 100,
    medianMaxDD: pct_(maxDDs, 0.5), p95MaxDD: pct_(maxDDs, 0.95)
  };
}

/* ---------- Position sizing ---------- */
function sizePosition(o) {
  const risk = (Number(o.balance) || 0) * (Number(o.riskPct) || 0) / 100;
  const dist = Math.abs((Number(o.entry) || 0) - (Number(o.stop) || 0));
  const spec = SYMBOL_TYPES.find(s => s.id === o.type) || SYMBOL_TYPES[0];
  const mult = o.mult ? Number(o.mult) : spec.mult;
  const perUnit = dist * mult;
  const size = perUnit > 0 ? risk / perUnit : 0;
  const rr = dist > 0 && o.target ? Math.abs(Number(o.target) - Number(o.entry)) / dist : 0;
  return {
    risk, dist, size, unit: spec.unit, mult,
    notional: size * mult * (Number(o.entry) || 0),
    reward: rr * risk, rr,
    valid: perUnit > 0 && risk > 0
  };
}

/* ---------- Insights ---------- */
function insights(trades, m) {
  const out = [];
  if (trades.length < 4) return out;

  const byDay = group(trades, t => { const d = dt(t.exitAt || t.entryAt); return d ? d.getDay() : null; }, k => dayShort(k));
  const solid = byDay.filter(g => g.n >= 3);
  if (solid.length >= 2) {
    const best = solid[0], worst = solid[solid.length - 1];
    out.push({ tone: 'good', h: tx('Best weekday: {d}', { d: best.label }), badge: signed(best.pnl, 0),
      d: tx('{n} trades, {w} win rate, {r} average.', { n: best.n, w: pct(best.winRate), r: rfmt(best.avgR) }) });
    if (worst.pnl < 0) out.push({ tone: 'bad', h: tx('Worst weekday: {d}', { d: worst.label }), badge: signed(worst.pnl, 0),
      d: tx('{n} trades at {w}. Worth sizing down here, or sitting out.', { n: worst.n, w: pct(worst.winRate) }) });
  }

  const bySetup = group(trades, t => t.setup).filter(g => g.n >= 3);
  if (bySetup.length >= 2) {
    const b = bySetup[0], w = bySetup[bySetup.length - 1];
    out.push({ tone: 'info', h: tx('Strongest setup: {s}', { s: b.label }), badge: rfmt(b.avgR),
      d: tx('{n} trades, {w} win rate, {p} total.', { n: b.n, w: pct(b.winRate), p: signed(b.pnl, 0) }) });
    if (w.avgR < 0) out.push({ tone: 'warn', h: b.label !== w.label ? tx('{s} is bleeding', { s: w.label }) : tx('Setup drag'), badge: rfmt(w.avgR),
      d: tx('{n} trades at {w}. Either it needs a filter or it needs dropping.', { n: w.n, w: pct(w.winRate) }) });
  }

  const byDir = group(trades, t => t.direction, k => tx(k === 'long' ? 'Long' : 'Short')).filter(g => g.n >= 3);
  if (byDir.length === 2 && Math.abs(byDir[0].avgR - byDir[1].avgR) > 0.5) {
    out.push({ tone: 'info', h: tx('{d}s carry the account', { d: byDir[0].label }), badge: rfmt(byDir[0].avgR),
      d: tx('{a}: {ar} over {an}. {b}: {br} over {bn}.', {
        a: byDir[0].label, ar: rfmt(byDir[0].avgR), an: byDir[0].n,
        b: byDir[1].label, br: rfmt(byDir[1].avgR), bn: byDir[1].n }) });
  }

  const bySess = group(trades, t => { const d = dt(t.entryAt); return d ? sessionOf(d.getHours()).id : null; },
    k => tx((SESSIONS.find(s => s.id === k) || {}).label || k)).filter(g => g.n >= 3);
  if (bySess.length >= 2) {
    out.push({ tone: 'good', h: tx('Best session: {s}', { s: bySess[0].label }), badge: rfmt(bySess[0].avgR),
      d: tx('{n} trades, {w} win rate.', { n: bySess[0].n, w: pct(bySess[0].winRate) }) });
  }

  if (m.expectancyR !== 0) {
    const tone = m.expectancyR > 0 ? 'good' : 'bad';
    out.push({ tone, h: tx('Expectancy per trade'), badge: rfmt(m.expectancyR),
      d: tx('Risking {risk} a trade, the average trade returns {v}. Over 100 trades that is {total}.',
        { risk: money(mean(trades.map(t => t.risk)), 0), v: money(m.expectancyUSD), total: signed(m.expectancyUSD * 100, 0) }) });
  }

  if (m.maxLossStreak >= 3) {
    out.push({ tone: 'warn', h: tx('Longest losing run: {n}', { n: m.maxLossStreak }), badge: tx('{n} in a row', { n: m.maxLossStreak }),
      d: tx('At {w} loss rate a run this long is normal. Size so it stays survivable.', { w: pct(100 - m.winRate) }) });
  }
  return out;
}
</script>
<script>
/* ============================================================
   CHARTS — hand-drawn SVG. One scale per chart, hairline grid,
   thin marks, a hover layer on every plot.
   ============================================================ */
const CHART_FNS = {};
const CHART_Q = [];
/** Charts draw at the pixel width of their container, so 11px type is 11px
 *  in a wide panel and in a narrow one. Views reserve a slot; render fills it. */
function slot(name, args, opt) {
  CHART_Q.push({ name, args, opt: opt || {} });
  return '<div class="chart-host" data-ci="' + (CHART_Q.length - 1) + '"></div>';
}
function paintCharts(root) {
  $$('.chart-host', root).forEach(el => {
    const rec = CHART_Q[Number(el.dataset.ci)];
    if (!rec || !CHART_FNS[rec.name]) return;
    const w = Math.max(300, Math.round(el.clientWidth || 640));
    el.innerHTML = CHART_FNS[rec.name].apply(null, rec.args.concat([Object.assign({}, rec.opt, { vw: w })]));
  });
}

function niceTicks(min, max, count) {
  if (min === max) { min -= 1; max += 1; }
  const span = max - min;
  const raw = span / Math.max(1, count);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm >= 5 ? 10 : norm >= 2 ? 5 : norm >= 1 ? 2 : 1) * mag;
  const lo = Math.floor(min / step) * step;
  const hi = Math.ceil(max / step) * step;
  const out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.abs(v) < step / 1e6 ? 0 : v);
  return out;
}
function axisFmt(v) {
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(a % 1e6 ? 1 : 0) + 'M';
  if (a >= 1000) return (v / 1000).toFixed(a % 1000 ? 1 : 0) + 'k';
  if (a >= 1) return String(Math.round(v));
  return String(+v.toFixed(2));
}
function wrap(inner, h, w) {
  w = w || 1000;
  return '<div class="chart-wrap"><svg class="chart" viewBox="0 0 ' + w + ' ' + h +
    '" style="width:100%;height:auto;aspect-ratio:' + w + '/' + h + '" role="img">' + inner + '</svg><div class="tip"></div></div>';
}

/* ---- Equity curve: line + area, emphasized endpoint, crosshair ---- */
function chartEquity(points, opt) {
  const o = Object.assign({ h: 280, pad: [16, 22, 36, 62] }, opt);
  const [pt, pr, pb, pl] = o.pad;
  const VW = o.vw || 1000;
  const h = o.h, iw = VW - pl - pr, ih = h - pt - pb;
  if (points.length < 2) return '<div class="empty">' + tx('Not enough closed trades to draw a curve yet.') + '</div>';
  const vals = points.map(p => p.v);
  const ticks = niceTicks(Math.min(...vals), Math.max(...vals), 5);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const X = i => pl + (points.length === 1 ? iw / 2 : i / (points.length - 1) * iw);
  const Y = v => pt + ih - (v - lo) / (hi - lo || 1) * ih;

  let g = '';
  ticks.forEach(v => {
    g += '<line class="gridline" x1="' + pl + '" x2="' + (pl + iw) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/>' +
      '<text class="tick" x="' + (pl - 9) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + axisFmt(v) + '</text>';
  });
  const line = points.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const area = line + ' L' + X(points.length - 1).toFixed(1) + ' ' + (pt + ih) + ' L' + X(0).toFixed(1) + ' ' + (pt + ih) + ' Z';
  const up = points[points.length - 1].v >= points[0].v;
  const col = up ? 'var(--profit)' : 'var(--loss)';

  // x labels: first, a few middles, last
  const stepL = Math.max(1, Math.round((points.length - 1) / 5));
  let xl = '';
  for (let i = 0; i < points.length; i += stepL) {
    xl += '<text class="tick" x="' + X(i).toFixed(1) + '" y="' + (pt + ih + 20) + '" text-anchor="middle">' + esc(points[i].label) + '</text>';
  }
  let hit = '';
  points.forEach((p, i) => {
    const bw = iw / Math.max(1, points.length - 1);
    hit += '<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + pt + '" width="' + bw.toFixed(1) + '" height="' + ih +
      '" fill="transparent" data-tip="' + esc(p.tip) + '" data-cx="' + X(i).toFixed(1) + '" data-cy="' + Y(p.v).toFixed(1) + '"/>';
  });
  const ex = X(points.length - 1), ey = Y(points[points.length - 1].v);
  return wrap(
    '<defs><linearGradient id="eqg" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="' + col + '" stop-opacity=".22"/><stop offset="100%" stop-color="' + col + '" stop-opacity="0"/>' +
    '</linearGradient></defs>' + g +
    '<path d="' + area + '" fill="url(#eqg)"/>' +
    '<path d="' + line + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="' + ex.toFixed(1) + '" cy="' + ey.toFixed(1) + '" r="4.5" fill="' + col + '" stroke="var(--surface)" stroke-width="2"/>' +
    '<line class="axisline" x1="' + pl + '" x2="' + (pl + iw) + '" y1="' + (pt + ih) + '" y2="' + (pt + ih) + '"/>' +
    xl + hit, h, VW);
}

/* ---- Drawdown: how far under the high-water mark, always negative ---- */
function chartDrawdown(points, opt) {
  const o = Object.assign({ h: 170, pad: [14, 22, 32, 62] }, opt);
  const [pt, pr, pb, pl] = o.pad;
  const VW = o.vw || 1000;
  const h = o.h, iw = VW - pl - pr, ih = h - pt - pb;
  if (points.length < 2) return '<div class="empty">' + tx('Not enough trades yet.') + '</div>';
  const maxDD = Math.max(0.0001, ...points.map(p => p.v));
  const ticks = niceTicks(-maxDD, 0, 3);
  const lo = ticks[0], hi = 0;
  const X = i => pl + i / (points.length - 1) * iw;
  const Y = v => pt + (0 - (-v)) / (0 - lo || 1) * ih;
  let g = '';
  ticks.forEach(v => {
    g += '<line class="gridline" x1="' + pl + '" x2="' + (pl + iw) + '" y1="' + Y(-v).toFixed(1) + '" y2="' + Y(-v).toFixed(1) + '"/>' +
      '<text class="tick" x="' + (pl - 9) + '" y="' + (Y(-v) + 3.5).toFixed(1) + '" text-anchor="end">' + axisFmt(v) + '</text>';
  });
  const line = points.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const area = line + ' L' + X(points.length - 1).toFixed(1) + ' ' + pt + ' L' + pl + ' ' + pt + ' Z';
  let hit = '';
  points.forEach((p, i) => {
    const bw = iw / Math.max(1, points.length - 1);
    hit += '<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + pt + '" width="' + bw.toFixed(1) + '" height="' + ih +
      '" fill="transparent" data-tip="' + esc(p.tip) + '" data-cx="' + X(i).toFixed(1) + '" data-cy="' + Y(p.v).toFixed(1) + '"/>';
  });
  return wrap(g +
    '<path d="' + area + '" fill="var(--loss)" fill-opacity=".16"/>' +
    '<path d="' + line + '" fill="none" stroke="var(--loss)" stroke-width="2" stroke-linejoin="round"/>' +
    '<line class="axisline" x1="' + pl + '" x2="' + (pl + iw) + '" y1="' + pt + '" y2="' + pt + '"/>' + hit, h, VW);
}

/* ---- Vertical bars around a zero baseline ---- */
function chartBars(items, opt) {
  const o = Object.assign({ h: 240, pad: [18, 22, 46, 62], colorBySign: true, fmt: v => money(v, 0) }, opt);
  const [pt, pr, pb, pl] = o.pad;
  const VW = o.vw || 1000;
  const h = o.h, iw = VW - pl - pr, ih = h - pt - pb;
  if (!items.length) return '<div class="empty">' + tx('Nothing in this range yet.') + '</div>';
  const vals = items.map(d => d.v);
  const ticks = niceTicks(Math.min(0, ...vals), Math.max(0, ...vals), 4);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const Y = v => pt + ih - (v - lo) / (hi - lo || 1) * ih;
  const bw = Math.min(46, iw / items.length * 0.62);
  const X = i => pl + (i + 0.5) * (iw / items.length);
  let g = '';
  ticks.forEach(v => {
    g += '<line class="gridline" x1="' + pl + '" x2="' + (pl + iw) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/>' +
      '<text class="tick" x="' + (pl - 9) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + axisFmt(v) + '</text>';
  });
  let bars = '', labs = '';
  const per = iw / items.length;
  const skip = per < 46 ? Math.ceil(46 / per) : 1;
  items.forEach((d, i) => {
    const y0 = Y(0), y1 = Y(d.v);
    const top = Math.min(y0, y1), hgt = Math.max(2, Math.abs(y1 - y0));
    const col = d.color || (o.colorBySign ? (d.v >= 0 ? 'var(--profit)' : 'var(--loss)') : 'var(--s1)');
    if (d.v !== 0) bars += '<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + bw.toFixed(1) +
      '" height="' + hgt.toFixed(1) + '" rx="3" fill="' + col + '" data-tip="' + esc(d.tip || (d.label + ' · ' + o.fmt(d.v))) +
      '" data-cx="' + X(i).toFixed(1) + '" data-cy="' + top.toFixed(1) + '"/>';
    if (i % skip === 0) labs += '<text class="tick" x="' + X(i).toFixed(1) + '" y="' + (pt + ih + 20) + '" text-anchor="middle">' + esc(d.label) + '</text>';
  });
  return wrap(g + '<line class="axisline" x1="' + pl + '" x2="' + (pl + iw) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '"/>' + bars + labs, h, VW);
}

/* ---- Donut: part-to-whole at a glance, capped at 6 slices ---- */
function chartDonut(slices, opt) {
  const o = Object.assign({ h: 230 }, opt);
  const VW = o.vw || 1000;
  const total = sum(slices.map(s => s.v));
  if (!total) return '<div class="empty">' + tx('No trades to split yet.') + '</div>';
  const cx = VW / 2, cy = o.h / 2, rOut = Math.min(o.h / 2 - 12, 92), rIn = rOut * 0.6;
  let a0 = -Math.PI / 2, out = '';
  slices.forEach(s => {
    const frac = s.v / total, a1 = a0 + frac * Math.PI * 2;
    const large = frac > 0.5 ? 1 : 0;
    const gap = 0.012;
    const b0 = a0 + gap, b1 = Math.max(b0 + 0.001, a1 - gap);
    const p = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
    const [x1, y1] = p(rOut, b0), [x2, y2] = p(rOut, b1), [x3, y3] = p(rIn, b1), [x4, y4] = p(rIn, b0);
    out += '<path d="M' + x1.toFixed(1) + ' ' + y1.toFixed(1) + ' A' + rOut + ' ' + rOut + ' 0 ' + large + ' 1 ' + x2.toFixed(1) + ' ' + y2.toFixed(1) +
      ' L' + x3.toFixed(1) + ' ' + y3.toFixed(1) + ' A' + rIn + ' ' + rIn + ' 0 ' + large + ' 0 ' + x4.toFixed(1) + ' ' + y4.toFixed(1) + ' Z" fill="' + s.color +
      '" data-tip="' + esc(s.label + ' · ' + s.v + ' trades · ' + pct(frac * 100)) + '" data-cx="' + (cx + (rOut + rIn) / 2 * Math.cos((b0 + b1) / 2)).toFixed(1) +
      '" data-cy="' + (cy + (rOut + rIn) / 2 * Math.sin((b0 + b1) / 2)).toFixed(1) + '"/>';
    a0 = a1;
  });
  const big = slices.slice().sort((a, b) => b.v - a.v)[0];
  out += '<text x="' + cx + '" y="' + (cy - 4) + '" text-anchor="middle" style="font-family:var(--font-mono);font-size:22px;font-weight:600;fill:var(--ink)">' + total + '</text>' +
    '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" style="font-size:11px;fill:var(--ink-3)">' + tx('trades') + '</text>';
  return wrap(out, o.h, VW);
}

/* ---- Monte Carlo fan: percentile bands of the same edge, reshuffled ---- */
function chartFan(bands, start, opt) {
  const o = Object.assign({ h: 300, pad: [18, 24, 38, 66] }, opt);
  const [pt, pr, pb, pl] = o.pad;
  const VW = o.vw || 1000;
  const h = o.h, iw = VW - pl - pr, ih = h - pt - pb;
  const all = bands.flatMap(b => [b.p05, b.p95]);
  const ticks = niceTicks(Math.min(...all, start), Math.max(...all, start), 5);
  const lo = ticks[0], hi = ticks[ticks.length - 1];
  const X = i => pl + i / (bands.length - 1) * iw;
  const Y = v => pt + ih - (v - lo) / (hi - lo || 1) * ih;
  let g = '';
  ticks.forEach(v => {
    g += '<line class="gridline" x1="' + pl + '" x2="' + (pl + iw) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/>' +
      '<text class="tick" x="' + (pl - 9) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + axisFmt(v) + '</text>';
  });
  const band = (a, b) => bands.map((d, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(d[a]).toFixed(1)).join(' ') + ' ' +
    bands.slice().reverse().map((d, i) => 'L' + X(bands.length - 1 - i).toFixed(1) + ' ' + Y(d[b]).toFixed(1)).join(' ') + ' Z';
  const med = bands.map((d, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(d.p50).toFixed(1)).join(' ');
  let hit = '';
  bands.forEach((d, i) => {
    if (i % 5 && i !== bands.length - 1) return;
    const bw = iw / bands.length * 5;
    hit += '<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + pt + '" width="' + bw.toFixed(1) + '" height="' + ih + '" fill="transparent" data-tip="' +
      esc('Trade ' + d.s + ' — median ' + money(d.p50, 0) + ' · 90% band ' + money(d.p05, 0) + ' to ' + money(d.p95, 0)) +
      '" data-cx="' + X(i).toFixed(1) + '" data-cy="' + Y(d.p50).toFixed(1) + '"/>';
  });
  let xl = '';
  for (let i = 0; i < bands.length; i += Math.max(1, Math.round((bands.length - 1) / 5))) {
    xl += '<text class="tick" x="' + X(i).toFixed(1) + '" y="' + (pt + ih + 20) + '" text-anchor="middle">' + i + '</text>';
  }
  return wrap(g +
    '<path d="' + band('p05', 'p95') + '" fill="var(--s1)" fill-opacity=".14"/>' +
    '<path d="' + band('p25', 'p75') + '" fill="var(--s1)" fill-opacity=".24"/>' +
    '<path d="' + med + '" fill="none" stroke="var(--s1)" stroke-width="2"/>' +
    '<line x1="' + pl + '" x2="' + (pl + iw) + '" y1="' + Y(start).toFixed(1) + '" y2="' + Y(start).toFixed(1) + '" stroke="var(--ink-3)" stroke-width="1"/>' +
    '<text class="glab" x="' + (pl + iw - 4) + '" y="' + (Y(start) - 6).toFixed(1) + '" text-anchor="end">' + tx('starting equity') + '</text>' +
    '<line class="axisline" x1="' + pl + '" x2="' + (pl + iw) + '" y1="' + (pt + ih) + '" y2="' + (pt + ih) + '"/>' +
    xl + hit, h, VW);
}

/* ---- Scatter: how much of the move each trade actually kept ---- */
function chartScatter(points, opt) {
  const o = Object.assign({ h: 280, pad: [18, 26, 42, 62] }, opt);
  const [pt, pr, pb, pl] = o.pad;
  const VW = o.vw || 1000;
  const h = o.h, iw = VW - pl - pr, ih = h - pt - pb;
  if (!points.length) return '<div class="empty">' + tx('Log MFE on a few trades and this fills in.') + '</div>';
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const xt = niceTicks(0, Math.max(1, ...xs), 4), yt = niceTicks(Math.min(-1.2, ...ys), Math.max(1, ...ys), 4);
  const xlo = xt[0], xhi = xt[xt.length - 1], ylo = yt[0], yhi = yt[yt.length - 1];
  const X = v => pl + (v - xlo) / (xhi - xlo || 1) * iw;
  const Y = v => pt + ih - (v - ylo) / (yhi - ylo || 1) * ih;
  let g = '';
  yt.forEach(v => {
    g += '<line class="gridline" x1="' + pl + '" x2="' + (pl + iw) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/>' +
      '<text class="tick" x="' + (pl - 9) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + v.toFixed(1) + 'R</text>';
  });
  xt.forEach(v => { g += '<text class="tick" x="' + X(v).toFixed(1) + '" y="' + (pt + ih + 20) + '" text-anchor="middle">' + v.toFixed(1) + 'R</text>'; });
  // The 45° line: everything the trade offered was kept
  const dmax = Math.min(xhi, yhi);
  g += '<line x1="' + X(0).toFixed(1) + '" y1="' + Y(0).toFixed(1) + '" x2="' + X(dmax).toFixed(1) + '" y2="' + Y(dmax).toFixed(1) +
    '" stroke="var(--ink-3)" stroke-width="1"/>' +
    '<text class="glab" x="' + X(dmax).toFixed(1) + '" y="' + (Y(dmax) - 8).toFixed(1) + '" text-anchor="end">' + tx('kept the whole move') + '</text>';
  let dots = '';
  points.forEach(p => {
    const col = p.y > 0 ? 'var(--profit)' : 'var(--loss)';
    dots += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="5" fill="' + col + '" fill-opacity=".8" stroke="var(--surface)" stroke-width="2" data-tip="' +
      esc(p.label) + '" data-cx="' + X(p.x).toFixed(1) + '" data-cy="' + Y(p.y).toFixed(1) + '"/>';
  });
  return wrap(g +
    '<line class="axisline" x1="' + pl + '" x2="' + (pl + iw) + '" y1="' + Y(0).toFixed(1) + '" y2="' + Y(0).toFixed(1) + '"/>' +
    '<line class="axisline" x1="' + pl + '" x2="' + pl + '" y1="' + pt + '" y2="' + (pt + ih) + '"/>' + dots +
    '<text class="glab" x="' + (pl + iw / 2) + '" y="' + (pt + ih + 38) + '" text-anchor="middle">' + tx('best unrealised move (MFE, in R)') + '</text>', h, VW);
}

/* ---- Hover layer, shared by every chart ---- */
function wireCharts(root) {
  $$('.chart-wrap', root).forEach(w => {
    const tip = $('.tip', w), svg = $('svg', w);
    if (!tip || !svg) return;
    w.addEventListener('pointermove', e => {
      const el = e.target.closest('[data-tip]');
      if (!el) { tip.classList.remove('on'); return; }
      const box = svg.getBoundingClientRect();
      const wbox = w.getBoundingClientRect();
      const k = box.width / (svg.viewBox.baseVal.width || 1000);
      const ox = box.left - wbox.left, oy = box.top - wbox.top;
      const cx = ox + Number(el.dataset.cx || 0) * k;
      const cy = oy + Number(el.dataset.cy || 0) * k;
      tip.innerHTML = el.dataset.tip.split(' \u00b7 ').map((s, i) =>
        i ? '<div class="l">' + esc(s) + '</div>' : '<div class="t">' + esc(s) + '</div>').join('');
      tip.style.left = clamp(cx, 70, wbox.width - 70) + 'px';
      tip.style.top = Math.max(34, cy) + 'px';
      tip.classList.add('on');
    });
    w.addEventListener('pointerleave', () => tip.classList.remove('on'));
  });
}

Object.assign(CHART_FNS, { chartEquity, chartDrawdown, chartBars, chartDonut, chartFan, chartScatter });

/* ---- Bar list: labelled horizontal comparison, plain HTML ---- */
function barList(rows, opt) {
  const o = Object.assign({ fmt: v => money(v, 0), signed: true }, opt);
  if (!rows.length) return '<div class="empty">' + tx('Nothing to compare yet.') + '</div>';
  const max = Math.max(...rows.map(r => Math.abs(r.v)), 0.0001);
  return '<div class="blist">' + rows.map(r => {
    const w = Math.abs(r.v) / max * 100;
    const col = r.color || (o.signed ? (r.v >= 0 ? 'var(--profit)' : 'var(--loss)') : 'var(--s1)');
    const neg = o.signed && r.v < 0;
    return '<div class="brow"><div class="lab" title="' + esc(r.label) + '">' + esc(r.label) + '</div>' +
      '<div class="track">' + (neg
        ? '<div class="fill" style="right:50%;width:' + (w / 2).toFixed(1) + '%;background:' + col + '"></div><div class="fill" style="left:50%;width:1px;background:var(--line-strong)"></div>'
        : (o.signed
          ? '<div class="fill" style="left:50%;width:' + (w / 2).toFixed(1) + '%;background:' + col + '"></div><div class="fill" style="left:50%;width:1px;background:var(--line-strong)"></div>'
          : '<div class="fill" style="left:0;width:' + w.toFixed(1) + '%;background:' + col + '"></div>')) +
      '</div><div class="val ' + (o.signed ? cls(r.v) : '') + '">' + esc(r.text || o.fmt(r.v)) + '</div></div>';
  }).join('') + '</div>';
}
</script>
<script>
/* ============================================================
   VIEWS
   ============================================================ */
const App = {
  view: 'dashboard',
  dashTab: 'overview',
  editingId: null,
  reviewId: null,
  cal: null,
  filters: { symbolType: '', direction: '', setup: '', perf: '', from: '', to: '', q: '' },
  mc: { horizon: 100, riskPct: null, ruin: 30, paths: 1500, result: null },
  sizer: null
};

const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)'];

function tile(k, v, s, klass) {
  return '<div class="tile' + (klass && klass.indexOf('lift') >= 0 ? ' lift' : '') + '">' +
    '<div class="k">' + esc(tx(k)) + '</div>' +
    '<div class="v ' + (klass || '').replace('lift', '').trim() + '">' + v + '</div>' +
    (s ? '<div class="s">' + tx(s) + '</div>' : '') + '</div>';
}
function panel(title, body, sub, actions) {
  return '<section class="panel panel-pad">' +
    '<div class="panel-head"><div><div class="panel-title">' + esc(tx(title)) + '</div>' +
    (sub ? '<div class="panel-sub">' + tx(sub) + '</div>' : '') + '</div>' + (actions || '') + '</div>' + body + '</section>';
}
function pfText(pf) { return pf === Infinity ? '∞' : num(pf, 2); }
function noTrades(msg) {
  return '<div class="panel panel-pad"><div class="empty"><h3>' + esc(tx(msg || 'No trades in this account yet')) + '</h3>' +
    '<p>' + tx('Log one on the {tab} tab and every chart here fills in.', { tab: '<strong>' + tx('New Trade') + '</strong>' }) + '</p>' +
    '<button class="btn btn-primary" data-go="new" style="margin-top:10px">' + tx('Log your first trade') + '</button></div></div>';
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function viewDashboard() {
  const trades = Store.scoped(), acc = Store.account();
  if (!trades.length) return dashSwitcher() + noTrades();
  const m = metrics(trades, acc);
  return dashSwitcher() + (App.dashTab === 'overview' ? dashOverview(trades, m, acc) : dashStats(trades, m, acc));
}
function dashSwitcher() {
  const b = (id, lab) => '<button class="chip" data-dashtab="' + id + '" aria-pressed="' + (App.dashTab === id) + '">' + tx(lab) + '</button>';
  return '<div class="rowflex" style="margin-bottom:16px">' + b('overview', 'Overview') + b('stats', 'Detailed statistics') + '</div>';
}

function dashOverview(trades, m, acc) {
  const goal = Number(acc.goal) || 0;
  const capital = m.equity, savings = Number(acc.savings) || 0;
  const progress = goal > 0 ? clamp((capital + savings) / goal * 100, 0, 100) : 0;
  const rep = disciplineReport(trades);

  const kpis = '<div class="grid g5" style="margin-bottom:14px">' +
    tile('Account equity', money(m.equity, 0), tx('Started at {v}', { v: money(m.start, 0) }), 'lift') +
    tile('Net P&L', signed(m.pnl, 0), tx('{v} return', { v: pct(m.returnPct) }), cls(m.pnl)) +
    tile('Win rate', pct(m.winRate), tx('{w}W · {l}L of {n}', { w: m.wins, l: m.losses, n: m.n })) +
    tile('Expectancy', rfmt(m.expectancyR), tx('{v} per trade', { v: money(m.expectancyUSD) }), cls(m.expectancyR)) +
    tile('Profit factor', pfText(m.pf), m.pf >= 1.5 ? 'Healthy' : m.pf >= 1 ? 'Thin but positive' : 'Losing money',
      m.pf >= 1.5 ? 'pos' : m.pf >= 1 ? 'warn' : 'neg') +
    '</div>';

  const curvePts = m.curve.map((p, i) => ({
    v: p.eq, label: p.at ? dshort(p.at) : 'Start',
    tip: (p.t ? p.t.symbol + ' ' + tx(p.t.direction === 'long' ? 'Long' : 'Short') : tx('starting equity')) + ' · ' + money(p.eq, 0) +
      (p.t ? ' · ' + signed(p.t.pnl) + ' (' + rfmt(R(p.t)) + ')' : '') + (p.at ? ' · ' + dlong(p.at) : '')
  }));
  const ddPts = m.curve.map(p => ({ v: p.dd, tip: (p.at ? dlong(p.at) : tx('starting equity')) + ' · ' + money(-p.dd, 0) }));

  const weeks = bucketByPeriod(trades, 'week').slice(-10);
  const months = bucketByPeriod(trades, 'month').slice(-8);

  const goalArc = (() => {
    const r = 66, c = 2 * Math.PI * r, off = c * (1 - progress / 100);
    return '<svg viewBox="0 0 180 180" style="width:180px;height:180px;display:block;margin:0 auto" role="img" aria-label="Goal progress ' + pct(progress) + '">' +
      '<circle cx="90" cy="90" r="' + r + '" fill="none" stroke="var(--surface-3)" stroke-width="11"/>' +
      '<circle cx="90" cy="90" r="' + r + '" fill="none" stroke="var(--gold)" stroke-width="11" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '" transform="rotate(-90 90 90)"/>' +
      '<text x="90" y="86" text-anchor="middle" style="font-family:var(--font-mono);font-size:26px;font-weight:600;fill:var(--ink)">' + pct(progress) + '</text>' +
      '<text x="90" y="106" text-anchor="middle" style="font-size:11px;fill:var(--ink-3)">' + tx('of goal') + '</text></svg>';
  })();

  const left = '<div class="stack">' +
    panel('Equity curve', slot('chartEquity', [curvePts]), tx('{acc} account, trade by trade', { acc: acc.name })) +
    panel('Underwater', slot('chartDrawdown', [ddPts]),
      tx('How far below the high-water mark the account sat after each trade — the deepest was {v} ({p})',
        { v: money(m.maxDD, 0), p: pct(m.maxDDpct) })) +
    '<div class="split-even">' +
    panel('By week', slot('chartBars', [weeks.map(w => ({ v: w.pnl, label: w.label, tip: tx('Week of {d}', { d: w.label }) + ' · ' + signed(w.pnl) + ' · ' + tx('{n} trades', { n: w.n }) }))], { h: 210 })) +
    panel('By month', slot('chartBars', [months.map(w => ({ v: w.pnl, label: w.label.split(' ')[0], tip: w.label + ' · ' + signed(w.pnl) + ' · ' + tx('{n} trades', { n: w.n }) }))], { h: 210 })) +
    '</div></div>';

  const right = '<div class="stack">' +
    panel(tx('Road to {goal}', { goal: money(goal, 0) }), goalArc +
      '<div style="margin-top:14px">' +
      '<div class="kv"><span class="k">' + tx('Trading capital') + '</span><span class="v">' + money(capital, 0) + '</span></div>' +
      '<div class="kv"><span class="k">' + tx('Set aside') + '</span><span class="v">' + money(savings, 0) + '</span></div>' +
      '<div class="kv"><span class="k">' + tx('Still to go') + '</span><span class="v">' + money(Math.max(0, goal - capital - savings), 0) + '</span></div>' +
      '</div>') +
    panel('Process scorecard', '<div class="stack" style="gap:10px">' +
      '<div class="kv"><span class="k">' + tx('Trades that broke no rule') + '</span><span class="v ' + (rep.score >= 80 ? 'pos' : rep.score >= 60 ? 'warn' : 'neg') + '">' + pct(rep.score) + '</span></div>' +
      '<div class="kv"><span class="k">' + tx('P&L from those trades') + '</span><span class="v ' + cls(rep.cleanPnl) + '">' + signed(rep.cleanPnl, 0) + '</span></div>' +
      '<div class="kv"><span class="k">' + tx('P&L from the rest') + '</span><span class="v ' + cls(rep.dirtyPnl) + '">' + signed(rep.dirtyPnl, 0) + '</span></div>' +
      '<div class="kv"><span class="k">' + tx('Average execution grade') + '</span><span class="v">' + num(mean(trades.filter(t => t.quality).map(t => t.quality)), 1) + ' / 5</span></div>' +
      '</div><button class="btn btn-sm" data-go="discipline" style="margin-top:12px">' + tx('Open discipline report') + '</button>',
      'What the account looks like when you follow your own rules') +
    panel('Account', '<div class="stack" style="gap:0">' +
      '<div class="kv"><span class="k">' + tx('Total return') + '</span><span class="v ' + cls(m.returnPct) + '">' + pct(m.returnPct) + '</span></div>' +
      '<div class="kv"><span class="k">' + tx('Max drawdown') + '</span><span class="v neg">' + money(m.maxDD, 0) + '</span></div>' +
      '<div class="kv"><span class="k">' + tx('Best trade') + '</span><span class="v pos">' + money(m.largestWin, 0) + '</span></div>' +
      '<div class="kv"><span class="k">' + tx('Worst trade') + '</span><span class="v neg">' + money(m.largestLoss, 0) + '</span></div>' +
      '<div class="kv"><span class="k">' + tx('Active since') + '</span><span class="v">' + dlong(trades[0].entryAt) + '</span></div>' +
      '</div>') +
    '</div>';

  return kpis + '<div class="split">' + left + right + '</div>';
}

function dashStats(trades, m, acc) {
  const rep = disciplineReport(trades);
  const dayMap = byDayMap(trades);

  // last 14 calendar days
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
    const c = dayMap.get(dkey(d));
    days.push({
      v: c ? c.pnl : 0,

function calendarHTML(trades) {
  const map = byDayMap(trades);
  const y = App.cal.y, mo = App.cal.m;
  const first = new Date(y, mo, 1), start = new Date(first);
  start.setDate(1 - first.getDay());
  let html = '<div class="tw"><table class="cal"><thead><tr>' +
    [0, 1, 2, 3, 4, 5, 6].map(i => '<th class="eyebrow">' + dayInitial(i) + '</th>').join('') +
    '<th class="eyebrow">' + tx('Week') + '</th></tr></thead><tbody>';
  let monthTotal = 0;
  for (let w = 0; w < 6; w++) {
    let row = '', wk = 0, any = false;
    for (let d = 0; d < 7; d++) {
      const cur = new Date(start); cur.setDate(start.getDate() + w * 7 + d);
      const inMonth = cur.getMonth() === mo;
      const c = map.get(dkey(cur));
      if (c && inMonth) { wk += c.pnl; any = true; }
      const bg = c && inMonth
        ? (c.pnl > 0 ? 'background:var(--profit-wash);border-color:color-mix(in srgb,var(--profit) 32%,transparent)'
          : c.pnl < 0 ? 'background:var(--loss-wash);border-color:color-mix(in srgb,var(--loss) 32%,transparent)' : '')
        : '';
      row += '<td><div class="cell' + (inMonth ? '' : ' out') + '" style="' + bg + '">' +
        '<span class="d">' + cur.getDate() + '</span>' +
        (c && inMonth ? '<span class="p ' + cls(c.pnl) + '">' + signed(c.pnl, 0) + '</span><span class="c">' + c.n + ' ' + tx(c.n > 1 ? 'trades' : 'trade') + '</span>' :
          '<span class="c">' + (inMonth ? '—' : '') + '</span>') +
        '</div></td>';
    }
    monthTotal += wk;
    html += '<tr>' + row + '<td class="tot ' + (any ? cls(wk) : 'mut') + '">' + (any ? signed(wk, 0) : '—') + '</td></tr>';
    const probe = new Date(start); probe.setDate(start.getDate() + (w + 1) * 7);
    if (probe.getMonth() !== mo && w >= 4) break;
  }
  html += '</tbody></table></div>' +
    '<div class="rowflex" style="justify-content:flex-end;margin-top:10px"><span class="eyebrow">' + tx('Month total') + '</span>' +
    '<span class="num ' + cls(monthTotal) + '" style="font-size:16px;font-weight:600">' + signed(monthTotal, 0) + '</span></div>';
  return html;
}

/* ============================================================

   ============================================================ */
function filteredTrades() {
  const f = App.filters;
  return Store.scoped().filter(t => {
    if (f.symbolType && t.symbolType !== f.symbolType) return false;
    if (f.direction && t.direction !== f.direction) return false;
    if (f.setup && t.setup !== f.setup) return false;
    if (f.perf === 'win' && t.pnl <= 0) return false;
    if (f.perf === 'loss' && t.pnl >= 0) return false;
    if (f.from && new Date(t.entryAt) < new Date(f.from)) return false;
    if (f.to && new Date(t.entryAt) > new Date(f.to + 'T23:59')) return false;
    if (f.q && (t.symbol + ' ' + t.setup + ' ' + t.tags.join(' ')).toLowerCase().indexOf(f.q.toLowerCase()) < 0) return false;
    return true;
  }).sort((a, b) => new Date(b.entryAt) - new Date(a.entryAt));
}
